<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRUTO · Club de Café</title>
<style>

*{box-sizing:border-box}
:root{--paper:#f6e8d2;--paper2:#fff5e6;--orange:#df4d0b;--orange-dark:#b93c08;--ink:#4b2415;--line:#e5a078}
html{min-height:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--orange);font-family:Arial,Helvetica,sans-serif}
.wrap{position:relative;max-width:480px;margin:0 auto;padding:22px 20px 28px;overflow:hidden}
.wrap:before{content:"";position:absolute;z-index:0;right:-48px;top:95px;width:150px;height:150px;border:2px solid var(--orange);border-radius:50%;opacity:.22}
.wrap:after{content:"✦";position:absolute;z-index:0;right:25px;top:260px;font-size:38px;color:var(--orange);opacity:.75}
.logo{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;font-size:17px;line-height:1;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:5px 2px 17px;border-bottom:2px solid var(--orange)}
.logo:after{content:"COFFEE CLUB";font-size:10px;letter-spacing:.16em}
.card{position:relative;z-index:1;background:var(--paper2);border:2px solid var(--orange);border-radius:3px;padding:25px 22px;box-shadow:7px 7px 0 var(--orange);animation:cardIn .55s cubic-bezier(.2,.8,.2,1) both}
#login{margin-top:25px!important}
#loyalty{margin-top:25px!important}
.hero{text-align:left;margin:4px 0 26px}
.coffee{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border:2px solid var(--orange);border-radius:50%;overflow:hidden;transform:rotate(-8deg);background:var(--paper2)}
.coffee img{width:100%;height:100%;object-fit:contain;transform:rotate(8deg)}
.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(48px,13vw,68px);line-height:.84;letter-spacing:-.065em;text-transform:uppercase;margin:15px 0 12px;color:var(--orange);font-weight:900}
.hero p{max-width:280px;color:var(--ink);font-size:14px;line-height:1.5;font-weight:600;margin:0}
label{display:block;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--orange-dark);margin-top:8px}
input,button{width:100%;padding:15px 14px;border-radius:2px;font-size:15px}
input{border:1.5px solid var(--line);background:#fffaf2;color:var(--ink);margin:7px 0 13px;outline:none}
input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #df4d0b20}
input::placeholder{color:#b98c73}
button{border:2px solid var(--orange);background:var(--orange);color:#fff5e6;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
button:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink);background:var(--orange-dark)}
button:active{transform:scale(.98)}
button.secondary{background:transparent;color:var(--orange);margin-top:16px}
.hidden{display:none}
.muted{color:var(--ink)}
#loyalty>p:first-child{font-size:10px;letter-spacing:.18em;font-weight:900;color:var(--orange);margin:0 0 8px}
#customerName{font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1;margin:0 0 7px;text-transform:uppercase;color:var(--orange);overflow-wrap:anywhere}
#loyalty>p:nth-of-type(2){font-size:12px;margin:0;color:var(--ink)}
.stamps{display:flex;gap:8px;justify-content:center;margin:25px 0 20px}
.stamp{width:48px;height:48px;flex:0 1 48px;border:1.5px solid var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--orange);overflow:hidden;transition:transform .3s ease,background .3s ease}
.stamp img{width:39px;height:39px;object-fit:contain;opacity:.38;transition:opacity .25s ease,transform .25s ease}
.stamp.on img{opacity:1;transform:scale(1.04)}
.stamp.on{background:var(--orange);color:var(--paper2);animation:stampPop .5s cubic-bezier(.2,1.5,.5,1) both}
.progress{height:9px;background:#f1d1b9;border:1px solid var(--orange);border-radius:0;overflow:hidden}
.progress div{height:100%;width:0;background:var(--orange);border-radius:0;transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative}
.progress div:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#ffffff88 48%,transparent 72%);animation:shine 1.8s linear infinite}
#status{text-align:center;font-weight:900;color:var(--orange-dark);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:13px 0}
.notice{margin-top:16px;padding:14px;border:1.5px solid var(--line);background:#fff0dc;color:var(--ink);font-size:14px;line-height:1.5}
.error{color:#b91c1c}
.progress-reward{margin-top:17px;padding:18px 14px;border:1.5px solid var(--orange);background:#fff5e6;text-align:center;animation:cardIn .5s ease both}
.progress-reward .big-number{font-family:Georgia,'Times New Roman',serif;font-size:48px;line-height:1;font-weight:900;color:var(--orange);margin:3px 0 7px}
.progress-reward .headline{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:900;color:var(--orange);text-transform:uppercase;line-height:1.05}
.progress-reward .support{font-size:13px;color:var(--ink);line-height:1.45;margin-top:8px}
.progress-reward .mini-track{display:flex;gap:7px;justify-content:center;margin:14px 0 8px}
.progress-reward .mini-dot{width:25px;height:25px;border:1px solid var(--orange);display:grid;place-items:center;background:transparent;color:var(--orange);font-size:12px;font-weight:800}
.progress-reward .mini-dot.done{background:var(--orange);color:white}
.progress-reward .motivation{display:inline-block;margin-top:8px;padding:7px 12px;background:var(--orange);color:#fff5e6;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.reward-unlocked{padding:24px 16px;text-align:center;border:2px solid var(--orange);background:#fbe0c5;box-shadow:5px 5px 0 var(--orange-dark);animation:cardIn .7s ease both}
.reward-unlocked .reward-icon{font-size:48px;display:block}
.reward-unlocked strong{display:block;font-family:Georgia,'Times New Roman',serif;font-size:26px;line-height:1;color:var(--orange);margin:8px 0;text-transform:uppercase}
.reward-unlocked span:last-child{font-size:13px;color:var(--ink);line-height:1.5}
.confetti{position:fixed;top:-15px;width:9px;height:14px;z-index:9999;pointer-events:none;animation:fall var(--duration) linear forwards}
.footer{text-align:center;color:var(--orange-dark);font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-top:30px}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes stampPop{0%{transform:scale(.45)}75%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes fall{to{transform:translate(var(--drift),110vh) rotate(720deg);opacity:.15}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

</style></head><body><div class="wrap"><div class="logo">BRUTO CONCEPT</div>
<section id="login" class="card" style="margin-top:25px"><div class="hero"><div class="coffee"><img src="logo.jpg" alt="logo BRUTO"></div><h1>BRUTO<br>CLUB</h1><p class="muted">Un compra, un sello. Volvé por más y desbloqueá premios.</p></div>
<label>Nombre</label><input id="name" placeholder="Ej. Juan Pérez"><label>WhatsApp</label><input id="phone" placeholder="Ej. 3511234567" inputmode="tel"><button onclick="register()">VER MI TARJETA</button><div id="msg" class="notice hidden"></div></section>
<section id="loyalty" class="card hidden" style="margin-top:25px"><p class="muted">BRUTO CLUB</p><h2 id="customerName"></h2><p class="muted">TU TARJETA DIGITAL</p><div id="stamps" class="stamps"></div><div class="progress"><div id="bar"></div></div><p id="status" style="text-align:center;font-weight:700"></p><div id="reward" class="notice"></div><button class="secondary" onclick="logout()">Volver al inicio</button></section>
<div class="footer">| Vermut | Birra | comida brutal· 📍25 de Mayo 876 Café de especialidad</div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyWWDHC4rZtJmQr-B2On0buiHINW3z1Fp96lJfLXC11JnjdEZiPCB10LXXZ-ZDnPAju/exec",GOAL=5;
function msg(t,c=""){let e=document.getElementById("msg");e.className="notice "+c;e.textContent=t}
async function api(action,data={}){let r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action,...data})});return await r.json()}
async function register(){let n=document.getElementById("name").value.trim(),p=document.getElementById("phone").value.trim();if(!n||!p)return msg("Completá los datos.","error");msg("Cargando...");try{let r=await api("getCustomer",{name:n,phone:p});if(!r.ok)return msg(r.error,"error");render(r.customer)}catch(e){msg("No se pudo conectar. Revisá la URL del Apps Script.","error")}}
function celebrate(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const colors=["#df4d0b","#f3a36f","#b93c08","#f6e8d2","#7b2f10"];
  for(let i=0;i<75;i++){
    const piece=document.createElement("i");piece.className="confetti";
    piece.style.left=(Math.random()*100)+"vw";piece.style.background=colors[i%colors.length];
    piece.style.setProperty("--duration",(2.2+Math.random()*2)+"s");
    piece.style.setProperty("--drift",((Math.random()-.5)*240)+"px");
    piece.style.animationDelay=(Math.random()*.5)+"s";document.body.appendChild(piece);
    piece.addEventListener("animationend",()=>piece.remove(),{once:true});
  }
}
function render(c){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("loyalty").classList.remove("hidden");
  document.getElementById("customerName").textContent=c.name;
  const stamps=document.getElementById("stamps");stamps.innerHTML="";
  for(let i=1;i<=GOAL;i++){
    const d=document.createElement("div");d.className="stamp "+(i<=c.stamps?"on":"");
    const cup=document.createElement("img");cup.src="vaso-bruto.png";cup.alt="Sello de café";d.appendChild(cup);d.style.animationDelay=(i*.07)+"s";stamps.appendChild(d);
  }
  const count=Math.min(Number(c.stamps)||0,GOAL);
  document.getElementById("bar").style.width=(count/GOAL*100)+"%";
  const status=document.getElementById("status"),reward=document.getElementById("reward");
  if(count>=GOAL){
    status.textContent="🎉 ¡Llegaste a la meta!";
    reward.className="reward-unlocked";
    reward.innerHTML='<span class="reward-icon">🎉☕</span><strong>¡UN CAFÉ POR LA CASA!</strong><span>Completaste los 5 sellos. Mostrá esta tarjeta en BRUTO y disfrutá tu premio.</span>';
    celebrate();
  }else{
    const left=GOAL-count;
    status.textContent=count+" de "+GOAL+" consumos";
    reward.className="progress-reward";
    const dots=Array.from({length:GOAL},(_,i)=>'<span class="mini-dot '+(i<count?'done':'')+'">'+(i<count?'✓':(i+1))+'</span>').join('');
    let headline,detail,motivation;
    if(count===0){headline="¡ARRANCA TU CAMINO BRUTO!";detail="Sumá tu primer sello y empezá a acercarte a tu recompensa.";motivation="¡Cada visita cuenta! ☕";}
    else if(left===1){headline="¡Estás a un solo sello!";detail="Con tu próxima visita completás la tarjeta y el próximo café va por nuestra cuenta.";motivation="¡EL PRÓXIMO CAFÉ VA POR BRUTO!";}
    else if(left===2){headline="¡Ya estás muy cerca!";detail="Te faltan solo 2 sellos para disfrutar tu café gratis.";motivation="¡Seguí así, vas genial! ✨";}
    else{headline="¡Vamos por esa recompensa!";detail="Cada café te acerca un poquito más. Ya llevás "+count+" de "+GOAL+" sellos.";motivation="Te faltan "+left+" sellos para tu premio";}
    reward.innerHTML='<div class="big-number">'+left+'</div><div class="headline">'+headline+'</div><div class="support">'+detail+'</div><div class="mini-track">'+dots+'</div><div class="motivation">'+motivation+'</div>';
  }
}
function logout(){document.getElementById("loyalty").classList.add("hidden");document.getElementById("login").classList.remove("hidden");document.getElementById("name").value="";document.getElementById("phone").value="";document.getElementById("msg").className="notice hidden";}
</script></body></html>
