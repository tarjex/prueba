<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarjex Panel</title>
<style>
*{box-sizing:border-box}
:root{--paper:#f6e8d2;--paper2:#fff5e6;--orange:#df4d0b;--orange-dark:#b93c08;--ink:#4b2415;--line:#e5a078}
html{min-height:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--orange);font-family:Arial,Helvetica,sans-serif}
button:focus-visible,input:focus-visible,.wa-link:focus-visible{outline:3px solid var(--orange-dark);outline-offset:3px}
.wrap{position:relative;max-width:600px;margin:0 auto;padding:22px 20px 32px;overflow:hidden;min-height:100vh}
.wrap:before{content:"";position:absolute;z-index:0;right:-48px;top:95px;width:150px;height:150px;border:2px solid var(--orange);border-radius:50%;opacity:.22;pointer-events:none}
.wrap:after{content:"✦";position:absolute;z-index:0;right:25px;top:260px;font-size:38px;color:var(--orange);opacity:.75;pointer-events:none}
.logo{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;font-size:17px;line-height:1;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:5px 2px 17px;border-bottom:2px solid var(--orange)}
.logo:after{content:"COFFEE CLUB";font-size:10px;letter-spacing:.16em}
.card{position:relative;z-index:1;background:var(--paper2);border:2px solid var(--orange);border-radius:3px;padding:24px 22px;margin-top:20px;box-shadow:7px 7px 0 var(--orange);animation:cardIn .45s ease both}
#login{margin-top:25px}
h1,h2{font-family:Georgia,'Times New Roman',serif;color:var(--orange);text-transform:uppercase;letter-spacing:-.035em}
h1{font-size:clamp(34px,9vw,48px);line-height:.95;margin:0 0 12px}
h2{font-size:25px;line-height:1.1;margin:0 0 14px}
p{color:var(--ink);line-height:1.5}
label{display:block;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--orange-dark);margin-top:8px}
input,button,.wa-link{width:100%;padding:14px;border-radius:2px;font-size:15px}
input{border:1.5px solid var(--line);background:#fffaf2;color:var(--ink);margin:7px 0 13px;outline:none}
input:focus{border-color:var(--orange);box-shadow:0 0 0 3px #df4d0b20}
input::placeholder{color:#b98c73}
button{border:2px solid var(--orange);background:var(--orange);color:#fff5e6;font-weight:900;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
button:hover,.wa-link:hover{transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink);background:var(--orange-dark)}
button:active,.wa-link:active{transform:scale(.98)}
.hidden{display:none!important}
.notice{padding:13px 14px;background:#fff0dc;border:1.5px solid var(--line);color:var(--ink);margin-top:12px;line-height:1.5;border-radius:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 17px;border-bottom:1px solid var(--line);margin-bottom:16px}
.pill{background:var(--orange);color:var(--paper2);padding:10px 13px;border:1.5px solid var(--orange);font-weight:900;white-space:nowrap}
.secondary{background:transparent;color:var(--orange);margin-top:10px}
.secondary:hover{color:var(--paper2)}
.wa-link{display:block;text-align:center;text-decoration:none;background:var(--orange);color:var(--paper2);font-weight:900;border:2px solid var(--orange);margin-top:12px;letter-spacing:.04em}
.small{font-size:12px;color:var(--ink);line-height:1.5}
#result .card{border:2px solid var(--orange);box-shadow:7px 7px 0 var(--orange);padding:22px}
#result h2{font-size:clamp(22px,6vw,30px);overflow-wrap:anywhere;margin:0 0 7px}
#result small{display:inline-block;font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--ink);overflow-wrap:anywhere}
#result .pill{font-size:16px}
#result button{min-height:50px;font-size:14px;margin-top:12px}
#result button.secondary{background:transparent;color:var(--orange);border:2px solid var(--orange)}
#result button.secondary:hover{background:var(--orange);color:var(--paper2)}
#result button.danger{border-color:#9f2d18;color:#9f2d18}
#result button.danger:hover{background:#9f2d18;color:#fff5e6}
#result .notice{background:#fff0dc;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.footer{text-align:center;position:relative;z-index:1;color:var(--orange-dark);font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-top:30px}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.wrap{padding:20px 16px 28px}.card,#result .card{padding:20px 17px}#result .pill{font-size:14px;padding:9px 10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">BRUTO</div>
  <div id="login" class="card">
    <h1>Panel del negocio</h1>
    <p>Ingresá el PIN del empleado.</p>
    <input id="pin" type="password" placeholder="PIN" autocomplete="current-password">
    <button onclick="login()">Ingresar</button>
    <div id="msg" class="notice hidden"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h2>Buscar cliente</h2>
      <input id="phone" placeholder="WhatsApp del cliente" inputmode="tel">
      <button onclick="search()">Buscar</button>
      <p class="small">Después de agregar un sello o canjear una recompensa, vas a poder abrir WhatsApp con un mensaje listo para enviar.</p>
    </div>
    <div id="result"></div>
  </div>
  <div class="footer">BRUTO COFFEE PARTY · GENERAL PAZ</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyWWDHC4rZtJmQr-B2On0buiHINW3z1Fp96lJfLXC11JnjdEZiPCB10LXXZ-ZDnPAju/exec";
const GOAL=5;
let pin="";

// Enter ejecuta la acción principal desde los campos del panel.
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("pin").addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();login();}
  });
  document.getElementById("phone").addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();search();}
  });
});

async function api(action,data={}){
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action,...data})});
  return await r.json();
}

function login(){
  pin=document.getElementById("pin").value.trim();
  if(!pin)return showLoginMessage("Ingresá el PIN.");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
}

function showLoginMessage(text){
  const el=document.getElementById("msg");
  el.textContent=text;
  el.classList.remove("hidden");
}

function element(tag, text, className){
  const el=document.createElement(tag);
  if(text!==undefined)el.textContent=text;
  if(className)el.className=className;
  return el;
}

// Convierte números argentinos habituales al formato internacional de WhatsApp.
// Si el número ya incluye 549, lo conserva.
function whatsappNumber(raw){
  let n=String(raw||"").replace(/\D/g,"");
  if(n.startsWith("00"))n=n.slice(2);
  if(n.startsWith("549"))return n;
  if(n.startsWith("54"))return "549"+n.slice(2).replace(/^9/,"");
  n=n.replace(/^0/,"").replace(/^15/,"");
  return "549"+n;
}

function whatsappUrl(customer,message){
  const number=whatsappNumber(customer.phone);
  return "https://wa.me/"+number+"?text="+encodeURIComponent(message);
}

function buildStampMessage(c){
  if(c.stamps>=GOAL){
    return `¡Hola ${c.name}! ¡Completaste tus ${GOAL} sellos de Café Club! Ya tenés tu café gratis. Mostrá tu tarjeta en el local para disfrutar tu recompensa. ¡Gracias por elegirnos!  &#x1F60D`; ;
  }
  const remaining=GOAL-c.stamps;
  return `¡Hola ${c.name}!  ¡Acabás de sumar un nuevo sello a tu Café Club! Ya tenés ${c.stamps} de ${GOAL} sellos. Te falta${remaining===1?"":"n"} ${remaining} para conseguir tu café gratis. ¡Te esperamos! `;
}

function buildRedeemMessage(c){
  return `¡Hola ${c.name}!  ¡Tu recompensa de Café Club fue canjeada! Gracias por visitarnos y ser parte de TARJEX. ¡Te esperamos pronto! `;
}

function renderCustomer(c, notification){
  const result=document.getElementById("result");
  result.innerHTML="";

  const card=element("div",undefined,"card");
  const top=element("div",undefined,"row");
  const info=element("div");
  info.appendChild(element("h2",c.name));
  info.appendChild(element("small",c.phone));
  top.appendChild(info);
  top.appendChild(element("span",`${c.stamps}/${GOAL} ☕`,"pill"));
  card.appendChild(top);

  if(notification){
    card.appendChild(element("div",notification.text,"notice"));
    const link=element("a","Abrir WhatsApp con mensaje listo","wa-link");
    link.href=whatsappUrl(c,notification.message);
    link.target="_blank";
    link.rel="noopener noreferrer";
    card.appendChild(link);
    card.appendChild(element("p","Se abrirá WhatsApp. Revisá el destinatario y tocá Enviar; el mensaje no se envía solo.","small"));
  }

  const add=element("button","＋ Agregar sello");
  add.type="button";
  add.onclick=()=>addStamp(c.phone);
  card.appendChild(add);

  const redeem=element("button","Canjear recompensa","secondary");
  redeem.type="button";
  redeem.onclick=()=>redeemReward(c.phone);
  card.appendChild(redeem);

  const remove=element("button","− Eliminar sello duplicado","secondary danger");
  remove.type="button";
  remove.disabled=Number(c.stamps)<=0;
  if(remove.disabled){remove.title="Este cliente no tiene sellos para eliminar";remove.style.opacity=".45";remove.style.cursor="not-allowed";}
  remove.onclick=()=>removeStamp(c.phone);
  card.appendChild(remove);

  result.appendChild(card);
}

async function search(){
  const p=document.getElementById("phone").value.trim();
  const result=document.getElementById("result");
  result.innerHTML="";
  if(!p)return;
  try{
    const r=await api("getCustomerByPhone",{phone:p});
    if(!r.ok){result.appendChild(element("div",r.error,"card"));return;}
    renderCustomer(r.customer);
  }catch(e){
    result.appendChild(element("div","No se pudo conectar. Revisá la URL de Apps Script.","card"));
  }
}

async function addStamp(phone){
  try{
    const r=await api("addStamp",{phone,pin});
    if(!r.ok){alert(r.error);return;}
    const c=r.customer;
    renderCustomer(c,{
      text:c.stamps>=GOAL
        ?"¡El cliente completó los 5 sellos! Prepará el mensaje para avisarle que tiene una recompensa."
        :"Sello agregado correctamente. Podés avisarle al cliente por WhatsApp.",
      message:buildStampMessage(c)
    });
  }catch(e){alert("No se pudo conectar con Google Sheets.");}
}

async function redeemReward(phone){
  try{
    const r=await api("redeem",{phone,pin});
    if(!r.ok){alert(r.error);return;}
    renderCustomer(r.customer,{
      text:"Recompensa canjeada correctamente. Podés enviarle un agradecimiento por WhatsApp.",
      message:buildRedeemMessage(r.customer)
    });
  }catch(e){alert("No se pudo conectar con Google Sheets.");}
}

async function removeStamp(phone){
  const confirmed=confirm("¿Estás seguro de que querés eliminar UN sello de este cliente?\n\nEsta acción no se puede deshacer.");
  if(!confirmed)return;
  try{
    const r=await api("removeStamp",{phone,pin});
    if(!r.ok){alert(r.error);return;}
    renderCustomer(r.customer,{
      text:"Se eliminó 1 sello correctamente. La cantidad del cliente ya está actualizada."
    });
  }catch(e){alert("No se pudo conectar con Google Sheets.");}
}
</script>
</body>
</html>
