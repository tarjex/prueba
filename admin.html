<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarjex Panel</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f5f7;--card:#ffffff;--blue:#315efb;--blue-dark:#2347d4;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--danger:#d93025}
html{min-height:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button:focus-visible,input:focus-visible,.wa-link:focus-visible{outline:3px solid #315efb55;outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding:28px 18px 32px;min-height:100vh}
.logo{display:flex;align-items:center;justify-content:space-between;font-size:13px;line-height:1;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding:4px 4px 6px}
.logo:after{content:"COFFEE CLUB";font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;margin-top:18px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.04);animation:cardIn .4s ease both}
#login{margin-top:36px}
h1,h2{color:var(--ink);letter-spacing:-.03em;font-weight:800}
h1{font-size:clamp(28px,8vw,34px);line-height:1.05;margin:0 0 10px}
h2{font-size:22px;line-height:1.15;margin:0 0 14px}
p{color:var(--muted);line-height:1.55;font-size:14.5px;margin:0 0 16px}
label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin-top:8px}
input,button,.wa-link{width:100%;padding:14px 16px;border-radius:12px;font-size:15px;font-family:inherit}
input{border:1px solid var(--line);background:#fff;color:var(--ink);margin:4px 0 12px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #315efb1f}
input::placeholder{color:#9ca3af}
button{border:1px solid var(--blue);background:var(--blue);color:#fff;font-weight:700;cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s}
button:hover,.wa-link:hover{background:var(--blue-dark);box-shadow:0 6px 16px #315efb33}
button:active,.wa-link:active{transform:scale(.985)}
.hidden{display:none!important}
.notice{padding:13px 14px;background:#f3f6ff;border:1px solid #dbe4ff;color:var(--ink);margin-top:12px;line-height:1.5;border-radius:12px;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:2px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.pill{background:#eef2ff;color:var(--blue);padding:9px 13px;border-radius:999px;font-weight:800;white-space:nowrap}
.secondary{background:#fff;color:var(--blue);border:1px solid var(--line);margin-top:10px}
.secondary:hover{background:#f3f6ff;color:var(--blue-dark);box-shadow:none}
.wa-link{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;font-weight:700;border:1px solid var(--blue);margin-top:12px}
.small{font-size:12px;color:var(--muted);line-height:1.5}
#result .card{padding:22px}
#result h2{font-size:clamp(20px,6vw,26px);overflow-wrap:anywhere;margin:0 0 4px}
#result small{display:inline-block;font-size:14px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
#result .pill{font-size:15px}
#result button{min-height:50px;font-size:14px;margin-top:12px}
#result button.secondary{background:#fff;color:var(--blue);border:1px solid var(--line)}
#result button.secondary:hover{background:#f3f6ff}
#result button.danger{color:var(--danger);border-color:#f3d4d1}
#result button.danger:hover{background:#fdf1f0;color:var(--danger)}
#result .notice{background:#f3f6ff;border:1px solid #dbe4ff;color:var(--ink);font-weight:500}
.footer{text-align:center;color:#9ca3af;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-top:28px}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.wrap{padding:22px 14px 28px}.card,#result .card{padding:20px 17px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">BRUTO</div>
  <div id="login" class="card">
    <h1>Panel del negocio</h1>
    <p>Ingresá el PIN del empleado.</p>
    <input id="pin" type="password" placeholder="PIN" autocomplete="current-password">
    <button onclick="login()">Ingresar</button>
    <div id="msg" class="notice hidden"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h2>Buscar cliente</h2>
      <input id="phone" placeholder="WhatsApp del cliente" inputmode="tel">
      <button onclick="search()">Buscar</button>
      <p class="small" style="margin-top:14px">Después de agregar un sello o canjear una recompensa, vas a poder abrir WhatsApp con un mensaje listo para enviar.</p>
    </div>
    <div id="result"></div>
  </div>
  <div class="footer">BRUTO CONCEPT</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyWWDHC4rZtJmQr-B2On0buiHINW3z1Fp96lJfLXC11JnjdEZiPCB10LXXZ-ZDnPAju/exec";
const GOAL=5;
let pin="";

// Enter ejecuta la acción principal desde los campos del panel.
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("pin").addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();login();}
  });
  document.getElementById("phone").addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();search();}
  });
});

async function api(action,data={}){
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action,...data})});
  return await r.json();
}

function login(){
  pin=document.getElementById("pin").value.trim();
  if(!pin)return showLoginMessage("Ingresá el PIN.");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
}

function showLoginMessage(text){
  const el=document.getElementById("msg");
  el.textContent=text;
  el.classList.remove("hidden");
}

function element(tag, text, className){
  const el=document.createElement(tag);
  if(text!==undefined)el.textContent=text;
  if(className)el.className=className;
  return el;
}

// Convierte números argentinos habituales al formato internacional de WhatsApp.
// Si el número ya incluye 549, lo conserva.
function whatsappNumber(raw){
  let n=String(raw||"").replace(/\D/g,"");
  if(n.startsWith("00"))n=n.slice(2);
  if(n.startsWith("549"))return n;
  if(n.startsWith("54"))return "549"+n.slice(2).replace(/^9/,"");
  n=n.replace(/^0/,"").replace(/^15/,"");
  return "549"+n;
}

function whatsappUrl(customer,message){
  const number=whatsappNumber(customer.phone);
  return "https://wa.me/"+number+"?text="+encodeURIComponent(message);
}

function buildStampMessage(c){
  if(c.stamps>=GOAL){
    return `¡Hola ${c.name}! ¡Completaste tus ${GOAL} sellos de Café Club! Ya tenés tu café gratis. Mostrá tu tarjeta en el local para disfrutar tu recompensa. ¡Gracias por elegirnos!  &#x1F60D`; ;
  }
  const remaining=GOAL-c.stamps;
  return `¡Hola ${c.name}!  ¡Acabás de sumar un nuevo sello a tu Café Club! Ya tenés ${c.stamps} de ${GOAL} sellos. Te falta${remaining===1?"":"n"} ${remaining} para conseguir tu café gratis. ¡Te esperamos! `;
}

function buildRedeemMessage(c){
  return `¡Hola ${c.name}!  ¡Tu recompensa de Café Club fue canjeada! Gracias por visitarnos y ser parte de TARJEX. ¡Te esperamos pronto! `;
}

function renderCustomer(c, notification){
  const result=document.getElementById("result");
  result.innerHTML="";

  const card=element("div",undefined,"card");
  const top=element("div",undefined,"row");
  const info=element("div");
  info.appendChild(element("h2",c.name));
  info.appendChild(element("small",c.phone));
  top.appendChild(info);
  top.appendChild(element("span",`${c.stamps}/${GOAL} ☕`,"pill"));
  card.appendChild(top);

  if(notification){
    card.appendChild(element("div",notification.text,"notice"));
    const link=element("a","Abrir WhatsApp con mensaje listo","wa-link");
    link.href=whatsappUrl(c,notification.message);
    link.target="_blank";
    link.rel="noopener noreferrer";
    card.appendChild(link);
    card.appendChild(element("p","Se abrirá WhatsApp. Revisá el destinatario y tocá Enviar; el mensaje no se envía solo.","small"));
  }

  const add=element("button","＋ Agregar sello");
  add.type="button";
  add.onclick=()=>addStamp(c.phone);
  card.appendChild(add);

  const redeem=element("button","Canjear recompensa","secondary");
  redeem.type="button";
  redeem.onclick=()=>redeemReward(c.phone);
  card.appendChild(redeem);

  const remove=element("button","− Eliminar sello duplicado","secondary danger");
  remove.type="button";
  remove.disabled=Number(c.stamps)<=0;
  if(remove.disabled){remove.title="Este cliente no tiene sellos para eliminar";remove.style.opacity=".45";remove.style.cursor="not-allowed";}
  remove.onclick=()=>removeStamp(c.phone);
  card.appendChild(remove);

  result.appendChild(card);
}

async function search(){
  const p=document.getElementById("phone").value.trim();
  const result=document.getElementById("result");
  result.innerHTML="";
  if(!p)return;
  try{
    const r=await api("getCustomerByPhone",{phone:p});
    if(!r.ok){result.appendChild(element("div",r.error,"card"));return;}
    renderCustomer(r.customer);
  }catch(e){
    result.appendChild(element("div","No se pudo conectar. Revisá la URL de Apps Script.","card"));
  }
}

async function addStamp(phone){
  try{
    const r=await api("addStamp",{phone,pin});
    if(!r.ok){alert(r.error);return;}
    const c=r.customer;
    renderCustomer(c,{
      text:c.stamps>=GOAL
        ?"¡El cliente completó los 5 sellos! Prepará el mensaje para avisarle que tiene una recompensa."
        :"Sello agregado correctamente. Podés avisarle al cliente por WhatsApp.",
      message:buildStampMessage(c)
    });
  }catch(e){alert("No se pudo conectar con Google Sheets.");}
}

async function redeemReward(phone){
  try{
    const r=await api("redeem",{phone,pin});
    if(!r.ok){alert(r.error);return;}
    renderCustomer(r.customer,{
      text:"Recompensa canjeada correctamente. Podés enviarle un agradecimiento por WhatsApp.",
      message:buildRedeemMessage(r.customer)
    });
  }catch(e){alert("No se pudo conectar con Google Sheets.");}
}

async function removeStamp(phone){
  const confirmed=confirm("¿Estás seguro de que querés eliminar UN sello de este cliente?\n\nEsta acción no se puede deshacer.");
  if(!confirmed)return;
  try{
    const r=await api("removeStamp",{phone,pin});
    if(!r.ok){alert(r.error);return;}
    renderCustomer(r.customer,{
      text:"Se eliminó 1 sello correctamente. La cantidad del cliente ya está actualizada."
    });
  }catch(e){alert("No se pudo conectar con Google Sheets.");}
}
</script>
</body>
</html>
