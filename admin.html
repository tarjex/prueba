<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjex Panel</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:Arial;color:#111827}.wrap{max-width:600px;margin:auto;padding:24px}.card{background:white;border:1px solid #e5e7eb;border-radius:22px;padding:22px;margin-top:18px}input,button{width:100%;padding:14px;border-radius:12px;font-size:16px}input{border:1px solid #d1d5db;margin:7px 0 12px}button{background:#111827;color:white;border:0;font-weight:700}.hidden{display:none}.notice{padding:13px;background:#f3f4f6;border-radius:12px;margin-top:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#eef2f7;padding:8px 12px;border-radius:999px;font-weight:700}.secondary{background:#eef2f7;color:#111827;margin-top:10px}</style></head>
<body><div class="wrap"><b style="font-size:22px">TARJEX</b><div id="login" class="card"><h1>Panel del negocio</h1><p>Ingresá el PIN del empleado.</p><input id="pin" type="password" placeholder="PIN"><button onclick="login()">Ingresar</button><div id="msg"></div></div>
<div id="panel" class="hidden"><div class="card"><h2>Buscar cliente</h2><input id="phone" placeholder="WhatsApp del cliente"><button onclick="search()">Buscar</button></div><div id="result"></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyWWDHC4rZtJmQr-B2On0buiHINW3z1Fp96lJfLXC11JnjdEZiPCB10LXXZ-ZDnPAju/exec";let pin="";
async function api(action,data={}){let r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action,...data})});return await r.json()}
function login(){pin=document.getElementById("pin").value;if(!pin)return;document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden")}
async function search(){let p=document.getElementById("phone").value.trim(),b=document.getElementById("result");b.innerHTML="";if(!p)return;let r=await api("getCustomerByPhone",{phone:p});if(!r.ok){b.innerHTML='<div class="card">'+r.error+"</div>";return}let c=r.customer;b.innerHTML='<div class="card"><div class="row"><div><h2>'+c.name+'</h2><small>'+c.phone+'</small></div><span class="pill">'+c.stamps+'/5 ☕</span></div><button onclick="addStamp(\''+encodeURIComponent(c.phone)+'\')">＋ Agregar sello</button><button class="secondary" onclick="redeem(\''+encodeURIComponent(c.phone)+'\')">Canjear recompensa</button></div>'}
async function addStamp(p){let r=await api("addStamp",{phone:decodeURIComponent(p),pin});if(!r.ok)return alert(r.error);search()}
async function redeem(p){let r=await api("redeem",{phone:decodeURIComponent(p),pin});if(!r.ok)return alert(r.error);alert("Recompensa canjeada");search()}
</script></body></html>
